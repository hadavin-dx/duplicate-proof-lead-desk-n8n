# SonarQube Cloud settings for the CI-based scan (.github/workflows/sonar.yml).
# Organisation and project key are the identifiers shown in SonarQube Cloud (not secrets).
sonar.organization=hadavin-dx
sonar.projectKey=hadavin-dx_duplicate-proof-lead-desk-n8n
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
# The whole repository is scanned (a listed folder that does not exist makes the scanner stop; main holds only a few files
# until the code merges). Files under tests/ count as test code. demo_only (made-up data, fixtures) and the portal test
# fixtures are not scored.
sonar.sources=.
sonar.test.inclusions=tests/**
sonar.exclusions=demo_only/**,tests/portal_fixtures/**,**/*.png,.git/**
