# SonarQube Cloud settings for the CI-based scan (.github/workflows/sonar.yml).
# Organisation and project key are the identifiers shown in SonarQube Cloud (not secrets).
sonar.organization=hadavin-dx
sonar.projectKey=hadavin-dx_duplicate-proof-lead-desk-n8n
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
# Production code, then tests. demo_only (made-up data, fixtures) and the portal test fixtures are not scored.
sonar.sources=src,tools,scripts,load_tools
sonar.tests=tests
sonar.exclusions=demo_only/**,tests/portal_fixtures/**,**/*.png
