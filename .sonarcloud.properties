# Settings for SonarQube Cloud "Automatic Analysis" (no workflow, no token, no repository secret).
# Automatic Analysis ignores sonar-project.properties and reads only this file, on the default branch
# (SonarSource docs, read 2026-11-12). It must NOT be combined with a CI-based Sonar scan: use one method per project.
# No organisation key and no project key are needed here: they are set in SonarQube Cloud when the repository is imported.
# Wildcard patterns are not allowed in this file, so folders are listed by name.
sonar.sources=src,tools,scripts,load_tools,demo_only
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
