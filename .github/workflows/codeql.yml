# CodeQL code scanning, "advanced setup" (this file). Do NOT also enable GitHub's default setup.
# Actions are pinned to full commit SHAs (looked up 2026-11-09, re-checked 2026-11-12: still the newest releases).
# Languages (ids checked against GitHub's CodeQL documentation on 2026-11-12): python, actions, and javascript-typescript
# (the portal pages in src/lead_desk/portal and the demo portal scripts are JavaScript). No result of this scan is claimed here.
# limit: if the first run refuses one of the languages, remove it.
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday. limit: scheduled runs may pause after inactivity

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # GitHub's codeql-action README: every advanced-setup workflow must have it (read 2026-11-12), it uploads the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
